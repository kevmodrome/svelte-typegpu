name: Package Preview

on:
  pull_request:

permissions: {}

jobs:
  preview:
    name: Publish preview package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish preview
        run: pnpm exec pkg-pr-new publish --pnpm --packageManager=pnpm --no-compact ./packages/svelte-typegpu
